# Frontend POS (Next.js). Backend ASP.NET Core nằm ở repo riêng.
#
#   docker compose up -d --build
#
# Đổi URL backend (nướng vào lúc build → cần build lại):
#   NEXT_PUBLIC_API_BASE_URL=http://backend:5000 docker compose up -d --build

services:
  web:
    build:
      context: .
      args:
        # Trong container, "localhost" là chính container — trỏ tới backend qua
        # tên service (nếu chung compose) hoặc host.docker.internal (backend chạy ở host).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://host.docker.internal:5000}
    image: pos-system:latest
    container_name: pos-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    # Cho phép container truy cập backend chạy trên máy host (Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Backend (tham khảo) — bật khi muốn chạy chung 1 compose ─────────────────
  # backend:
  #   image: pos-backend:latest        # build từ repo backend ASP.NET Core
  #   container_name: pos-backend
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   Khi bật backend ở đây, set:
  #   NEXT_PUBLIC_API_BASE_URL=http://backend:5000  (rồi build lại web)
