# Nginx reverse proxy cho POS frontend.
#
#   [Browser] → Nginx :80
#     /api/*  → backend ASP.NET Core (host.docker.internal:5056)
#     /*      → Next.js container (web:3000)
#
# Nhờ proxy này, frontend gọi /api/... TƯƠNG ĐỐI (baseURL='' trong axios.ts)
# nên không cần CORS và không lộ port backend ra browser.

events {}

http {
  # Backend chạy trên máy host (repo riêng), KHÔNG nằm trong compose này.
  # host.docker.internal trỏ về host nhờ extra_hosts trong docker-compose.yml.
  upstream backend {
    server host.docker.internal:5056;
  }

  upstream web {
    server web:3000;
  }

  server {
    listen 80;

    # Giữ nguyên prefix /api/ khi forward → backend nhận /api/auth/login đầy đủ.
    location /api/ {
      proxy_pass http://backend;
      # $http_host giữ nguyên Host kèm PORT client gửi (160.30.252.55:2222).
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://web;
      # QUAN TRỌNG: dùng $http_host (CÓ port) chứ KHÔNG dùng $host (mất port).
      # Next.js Server Actions so khớp Origin với x-forwarded-host — lệch port → bị chặn.
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket / HMR (nếu cần) + streaming responses của Next.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
