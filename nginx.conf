# Nginx reverse proxy cho POS frontend.
#
#   [Browser] → Nginx :80
#     /api/*  → backend ASP.NET Core (host.docker.internal:5056)
#     /*      → Next.js container (web:3000)
#
# Nhờ proxy này, frontend gọi /api/... TƯƠNG ĐỐI (baseURL='' trong axios.ts)
# nên không cần CORS và không lộ port backend ra browser.

events {}

http {
  # WebSocket: chỉ gửi "Connection: upgrade" khi client THẬT SỰ yêu cầu upgrade
  # (HMR/WebSocket); request HTTP thường → "close". KHÔNG hardcode "upgrade" cho mọi
  # request, vì nó phá streaming response của Next.js.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Backend chạy trên máy host (repo riêng), KHÔNG nằm trong compose này.
  # host.docker.internal trỏ về host nhờ extra_hosts trong docker-compose.yml.
  upstream backend {
    server host.docker.internal:5056;
  }

  upstream web {
    server web:3000;
  }

  server {
    listen 80;

    # Giữ nguyên prefix /api/ khi forward → backend nhận /api/auth/login đầy đủ.
    location /api/ {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      # $http_host giữ nguyên Host kèm PORT client gửi (160.30.252.55:2222).
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location / {
      proxy_pass http://web;
      # BẮT BUỘC HTTP/1.1: Next.js App Router stream RSC (chunked). Mặc định nginx
      # proxy bằng HTTP/1.0 → stream bị cắt → trình duyệt báo "This page couldn't load".
      proxy_http_version 1.1;
      # QUAN TRỌNG: dùng $http_host (CÓ port) chứ KHÔNG dùng $host (mất port).
      # Next.js Server Actions so khớp Origin với x-forwarded-host — lệch port → bị chặn.
      proxy_set_header Host              $http_host;
      proxy_set_header X-Forwarded-Host  $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # WebSocket / HMR + streaming responses của Next: chỉ upgrade khi client yêu cầu.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
